name: FFmpeg for Windows

# Build the LGPL FFmpeg DLLs used by Lichii at runtime. The same artifact is consumed
# by CI and by the automatic release workflow.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build the FFmpeg bundle from
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-windows
          key: ffmpeg-windows-${{ hashFiles('scripts/build-ffmpeg-windows.sh') }}
      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64 nasm
          scripts/build-ffmpeg-windows.sh ffmpeg-windows
      - name: Upload FFmpeg DLL bundle
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg-windows
