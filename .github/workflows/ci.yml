name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep independent pushes to main running independently so each successful commit can
# produce its own automatic release. PR updates still cancel superseded checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ffmpeg-windows:
    uses: ./.github/workflows/ffmpeg-windows.yml

  check:
    needs: ffmpeg-windows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          libavcodec=$(apt-cache pkgnames libavcodec | grep -E '^libavcodec[0-9]+(t64)?$' | sort -V | tail -1)
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libudev-dev libasound2-dev "$libavcodec" libxkbcommon-dev libwayland-dev spirv-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fetch FFmpeg
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg
      - run: cargo test --workspace
        env:
          LICHII_REQUIRE_FFMPEG: 1
          LICHII_FFMPEG_DIR: ${{ github.workspace }}/ffmpeg
